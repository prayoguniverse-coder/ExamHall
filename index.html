<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamHall - CBT Engine</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Supabase CDN Link -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="container auth-box">
    <h2>Welcome to ExamHall</h2>
   <div class="auth-tabs">
  <button type="button" class="active" onclick="switchAuthTab('login', event)">Login</button>
  <button type="button" class="active-signup" onclick="switchAuthTab('signup', event)">Sign Up</button>
</div>
    
    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group" id="name-group" style="display:none;">
        <label>Full Name</label>
        <input type="text" id="auth-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="auth-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-password" required>
      </div>
      <div class="form-group" id="role-group" style="display:none;">
        <label>Role</label>
        <select id="auth-role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <button type="submit" id="auth-btn" class="btn primary-btn">Login</button>
    </form>
  </div>

  <!-- Main App Layout (Header + Navigation) -->
  <div id="app" style="display: none;">
    <header class="navbar">
      <div class="logo">ExamHall <span>CBT</span></div>
      <div class="user-info">
        <span id="user-display"></span>
        <button onclick="logout()" class="btn danger-btn-sm">Logout</button>
      </div>
    </header>

    <!-- Student Dashboard -->
    <main id="student-dashboard" class="dashboard-container" style="display:none;">
      <h3>Available Exams</h3>
      <div id="exam-cards-list" class="cards-grid"></div>

      <h3 style="margin-top: 30px;">Exam History & Results</h3>
      <div id="history-cards-list" class="cards-grid"></div>
    </main>

    <!-- Teacher Dashboard -->
    <main id="teacher-dashboard" class="dashboard-container" style="display:none;">
      <div class="stats-grid">
        <div class="stat-card"><h4 id="stat-total-exams">0</h4><p>Total Exams</p></div>
        <div class="stat-card"><h4 id="stat-published-exams">0</h4><p>Published</p></div>
        <div class="stat-card"><h4 id="stat-total-attempts">0</h4><p>Total Attempts</p></div>
      </div>

      <div class="section-header">
        <h3>Exam Management</h3>
        <button onclick="showCreateExamModal()" class="btn primary-btn">+ Create Exam</button>
      </div>
      
      <div id="teacher-exams-list" class="cards-grid"></div>
    </main>
  </div>

  <!-- Student Active Exam Engine (Full Screen View) -->
  <div id="exam-engine" style="display: none;">
    <header class="exam-header">
      <h3 id="engine-exam-title">Exam Title</h3>
      <div class="timer-box">Time Remaining: <span id="timer-display">00:00</span></div>
    </header>

    <div class="exam-body">
      <div class="question-panel">
        <span class="badge" id="q-number-badge">Question 1</span>
        <p id="q-text" class="question-text"></p>
        <img id="q-image" src="" style="display:none; max-width: 100%; margin-bottom: 15px;">

        <div class="options-container" id="options-list"></div>

        <div class="exam-controls">
          <button onclick="prevQuestion()" class="btn secondary-btn">Previous</button>

          <button onclick="toggleMarkForReview()" class="btn warning-btn">Mark for Review</button>

          <button onclick="nextQuestion()" class="btn primary-btn">Next</button>
        </div>
      </div>

      <div class="question-palette">
        <h4>Questions</h4>
        <div id="palette-grid" class="palette-grid"></div>
        <button onclick="submitExam()" class="btn success-btn block-btn" style="margin-top: 20px;">Submit Exam</button>
      </div>
    </div>
  </div>

  <!-- Create Exam Modal -->
  <div id="create-exam-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Create New Exam</h3>
      <form id="create-exam-form" onsubmit="handleCreateExam(event)">
        <input type="text" id="exam-title" placeholder="Exam Title" required>
        <input type="number" id="exam-duration" placeholder="Duration (Minutes)" required>
        <input type="number" id="exam-passing" placeholder="Passing Percentage" value="40" required>
        <button type="submit" class="btn primary-btn">Create & Add Questions</button>
        <button type="button" onclick="closeModal()" class="btn secondary-btn">Cancel</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
